<!DOCTYPE html>

<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Component Counter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script type="module" src="./counter.js"></script>
</head>

<body>
  <div class="container my-5">
    <div class="card p-4">
      <h1 class="h4 mb-3"><i class="bi bi-calculator me-2"></i>Web Component Counter</h1>
      <div class="d-flex align-items-center gap-3">
        <!-- Using the custom element with an attribute -->
        <wiet-counter initial-value="10"></wiet-counter>
        <div id="log" class="ms-3"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const counter = document.querySelector('wiet-counter');
    const log = document.getElementById('log');

    counter.addEventListener('counter-change', (event) => {
      const value = event.detail.value;
      if (value % 5 === 0) {
        console.log(event);
      }
      log.innerHTML = `<span class="badge bg-secondary">New value: ${value}</span>`;
      console.log('New counter value:', value);
    });
  </script>

</body>

</html>
