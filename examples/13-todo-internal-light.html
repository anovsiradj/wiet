<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Example 13 - Todo App (Light DOM + Internal) | Wiet</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		.todo-item.done .todo-text {
			text-decoration: line-through;
			opacity: .5;
		}

		.todo-item {
			transition: opacity .2s;
		}

		.filter-bar .btn.active {
			box-shadow: 0 0 0 2px var(--bs-primary);
		}

		.priority-dot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			flex-shrink: 0;
		}

		.priority-dot.high {
			background: #dc3545;
		}

		.priority-dot.medium {
			background: #ffc107;
		}

		.priority-dot.low {
			background: #198754;
		}

		.progress-label {
			font-size: .8rem;
			color: var(--bs-secondary-color);
		}

		.app-header {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 12px 16px;
			background: rgba(13, 202, 240, .1);
			border-bottom: 1px solid #333;
			font-weight: 700;
			color: #eee;
			font-size: 15px;
		}
	</style>
</head>

<body>
	<page-header></page-header>

	<div class="container my-5">
		<div class="row">
			<div class="col-lg-8 mx-auto">
				<example-section icon="bi bi-check2-square" title="Example 13: Todo App (Light DOM + Internal)" description="Every component uses Light DOM and internal templates defined in &lt;template&gt; tags. The .header section is a &lt;slot&gt; processed by processSlots()." variant="info"></example-section>

				<todo-app></todo-app>

				<page-source></page-source>
			</div>
		</div>
	</div>

	<page-footer></page-footer>

	<template id="tpl-form">
		<form class="d-flex gap-2 mb-3" novalidate>
			<input type="text" class="form-control todo-input" placeholder="What needs to be done?" required>
			<select class="form-select priority-select" style="width:auto;flex-shrink:0">
				<option value="low"> Low</option>
				<option value="medium" selected> Medium</option>
				<option value="high"> High</option>
			</select>
			<button type="submit" class="btn btn-info flex-shrink-0"><i class="bi bi-plus-lg"></i></button>
		</form>
	</template>

	<template id="tpl-stats">
		<div class="mb-3">
			<div class="d-flex justify-content-between mb-1">
				<span class="progress-label stats-label">0 of 0 done</span>
				<span class="progress-label stats-pct">0%</span>
			</div>
			<div class="progress" style="height:6px">
				<div class="progress-bar bg-info stats-bar" style="width:0%;transition:width .4s ease"></div>
			</div>
		</div>
	</template>

	<template id="tpl-filter">
		<div class="d-flex gap-2 mb-3 filter-bar">
			<button class="btn btn-sm btn-outline-info active" data-filter="all">All</button>
			<button class="btn btn-sm btn-outline-info" data-filter="active">Active</button>
			<button class="btn btn-sm btn-outline-info" data-filter="done">Done</button>
		</div>
	</template>

	<template id="tpl-list">
		<div class="todo-list-wrap">
			<div class="todo-items list-group"></div>
			<div class="d-flex justify-content-between mt-2">
				<small class="text-muted list-count"></small>
				<button class="btn btn-sm btn-link text-info p-0 clear-done-btn">Clear done</button>
			</div>
		</div>
	</template>

	<template id="tpl-item">
		<div class="list-group-item todo-item d-flex align-items-center gap-2 px-3 py-2">
			<input type="checkbox" class="form-check-input todo-check" style="cursor:pointer">
			<span class="priority-dot"></span>
			<span class="todo-text flex-grow-1" style="cursor:pointer"></span>
			<button class="btn btn-sm btn-link text-danger p-0 delete-btn" title="Delete">
				<i class="bi bi-trash3"></i>
			</button>
		</div>
	</template>

	<template id="tpl-todo-app">
		<div class="card">
			<slot name="header">
				<div class="app-header">
					<i class="bi bi-check2-all text-info fs-5"></i>
					<span class="fw-bold">Wiet Todo (Light DOM + Internal)</span>
				</div>
			</slot>
			<div class="card-body">
				<todo-form></todo-form>
				<todo-stats></todo-stats>
				<todo-filter></todo-filter>
				<todo-list></todo-list>
			</div>
		</div>
	</template>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" class="source">
		import './layouts.js';
		import '../widgets.js';
		import { wietCreate, wietDefine, WietClass } from '../wiet.js';

		const store = {
			todos: [
				{ id: 1, text: 'Read wiet docs', priority: 'low', done: true },
				{ id: 2, text: 'Build a custom element', priority: 'medium', done: false },
				{ id: 3, text: 'Write unit tests', priority: 'high', done: false },
			],
			filter: 'all',
			nextId: 4,
		};

		function filteredTodos() {
			if (store.filter === 'active') return store.todos.filter(t => !t.done);
			if (store.filter === 'done') return store.todos.filter(t => t.done);
			return store.todos;
		}

		function notify() {
			document.dispatchEvent(new CustomEvent('todo:changed', { bubbles: true }));
		}

		wietDefine('todo-form', class extends WietClass() {
			constructor() {
				super();
				this.template = '#tpl-form';
			}

			mounted() {
				this.querySelector('form').addEventListener('submit', (e) => {
					e.preventDefault();
					const input = this.querySelector('.todo-input');
					const text = input.value.trim();
					if (!text) return;
					const priority = this.querySelector('.priority-select').value;
					this.dispatchEvent(new CustomEvent('todo:add', {
						bubbles: true, detail: { text, priority },
					}));
					input.value = '';
					input.focus();
				});
			}
		});

		wietDefine('todo-stats', class extends WietClass() {
			constructor() {
				super();
				this.template = '#tpl-stats';
			}

			mounted() {
				document.addEventListener('todo:changed', () => this.update());
				this.update();
			}

			update() {
				const total = store.todos.length;
				const done = store.todos.filter(t => t.done).length;
				const pct = total === 0 ? 0 : Math.round((done / total) * 100);
				this.querySelector('.stats-label').textContent = `${done} of ${total} done`;
				this.querySelector('.stats-pct').textContent = `${pct}%`;
				this.querySelector('.stats-bar').style.width = `${pct}%`;
			}
		});

		wietDefine('todo-filter', class extends WietClass() {
			constructor() {
				super();
				this.template = '#tpl-filter';
			}

			mounted() {
				this.querySelector('.filter-bar').addEventListener('click', (e) => {
					const btn = e.target.closest('[data-filter]');
					if (!btn) return;
					this.dispatchEvent(new CustomEvent('todo:filter', {
						bubbles: true, detail: { filter: btn.dataset.filter },
					}));
				});
				document.addEventListener('todo:changed', () => this.updateActive());
			}

			updateActive() {
				this.querySelectorAll('[data-filter]').forEach(btn => {
					btn.classList.toggle('active', btn.dataset.filter === store.filter);
				});
			}
		});

		wietDefine('todo-item', class extends WietClass() {
			static attrs = ['todo-id'];

			constructor() {
				super();
				this.template = '#tpl-item';
			}

			mounted() {
				this.render();
				this.querySelector('.todo-check').addEventListener('change', () => {
					this.dispatchEvent(new CustomEvent('todo:toggle', {
						bubbles: true, detail: { id: Number(this.todoId) },
					}));
				});
				this.querySelector('.delete-btn').addEventListener('click', () => {
					this.dispatchEvent(new CustomEvent('todo:delete', {
						bubbles: true, detail: { id: Number(this.todoId) },
					}));
				});
			}

			changed() { this.render(); }

			render() {
				const todo = store.todos.find(t => t.id === Number(this.todoId));
				if (!todo) return;
				this.querySelector('.todo-item').classList.toggle('done', todo.done);
				this.querySelector('.todo-check').checked = todo.done;
				this.querySelector('.todo-text').textContent = todo.text;
				const dot = this.querySelector('.priority-dot');
				dot.className = `priority-dot ${todo.priority}`;
			}
		});

		wietDefine('todo-list', class extends WietClass() {
			constructor() {
				super();
				this.template = '#tpl-list';
			}

			mounted() {
				document.addEventListener('todo:changed', () => this.renderItems());
				this.querySelector('.clear-done-btn').addEventListener('click', () => {
					store.todos = store.todos.filter(t => !t.done);
					notify();
				});
				this.renderItems();
			}

			renderItems() {
				const container = this.querySelector('.todo-items');
				const visible = filteredTodos();
				container.innerHTML = '';
				if (visible.length === 0) {
					container.appendChild(wietCreate('div', {
						props: {
							className: 'list-group-item text-muted text-center py-4',
							textContent: store.filter === 'done' ? 'No completed tasks yet.' : 'Nothing to do, enjoy your day!',
						},
					}));
				} else {
					visible.forEach(todo => {
						container.appendChild(wietCreate('todo-item', {
							attrs: { 'todo-id': String(todo.id) },
						}));
					});
				}
				const count = visible.length;
				this.querySelector('.list-count').textContent = `${count} item${count !== 1 ? 's' : ''}`;
			}
		});

		wietDefine('todo-app', class extends WietClass() {
			constructor() {
				super();
				this.template = '#tpl-todo-app';
			}

			mounted() {
				this.addEventListener('todo:add', (e) => {
					store.todos.push({ id: store.nextId++, text: e.detail.text, priority: e.detail.priority, done: false });
					notify();
				});
				this.addEventListener('todo:toggle', (e) => {
					const todo = store.todos.find(t => t.id === e.detail.id);
					if (todo) todo.done = !todo.done;
					notify();
				});
				this.addEventListener('todo:delete', (e) => {
					store.todos = store.todos.filter(t => t.id !== e.detail.id);
					notify();
				});
				this.addEventListener('todo:filter', (e) => {
					store.filter = e.detail.filter;
					notify();
				});
			}
		});
	</script>
</body>

</html>
