<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Example 15 - Todo Light DOM + External | Wiet</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		.priority-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
		.priority-dot.high { background: #dc3545; }
		.priority-dot.medium { background: #ffc107; }
		.priority-dot.low { background: #198754; }
	</style>
</head>

<body>
	<page-header></page-header>

	<div class="container my-5">
		<div class="row">
			<div class="col-lg-8 mx-auto">
				<example-section icon="bi bi-check2-square" title="Example 15: Todo App (Light DOM + External)" description="All components use Light DOM with templates loaded from external HTML files via Fetch. Templates are self-contained with embedded styles." variant="info"></example-section>

				<todo-app></todo-app>

				<view-code></view-code>
			</div>
		</div>
	</div>

	<page-footer></page-footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" class="source">
		import './examples/layouts.js';
		import './widgets.js';
		import { wietCreate, wietDefine, WietClass } from './wiet.js';

		const store = {
			todos: [
				{ id: 1, text: 'Read wiet docs', priority: 'low', done: true },
				{ id: 2, text: 'Build a custom element', priority: 'medium', done: false },
				{ id: 3, text: 'Write unit tests', priority: 'high', done: false },
			],
			filter: 'all',
			nextId: 4,
		};

		function filteredTodos() {
			if (store.filter === 'active') return store.todos.filter(t => !t.done);
			if (store.filter === 'done') return store.todos.filter(t => t.done);
			return store.todos;
		}

		function notify() {
			document.dispatchEvent(new CustomEvent('todo:changed', { bubbles: true }));
		}

		wietDefine('todo-form', class extends WietClass() {
			constructor() { super(); this.template = './widgets/todo/todo-form.html'; }
			mounted() {
				this.querySelector('form').addEventListener('submit', (e) => {
					e.preventDefault();
					const input = this.querySelector('.input');
					const text = input.value.trim();
					if (!text) return;
					const priority = this.querySelector('.select').value;
					this.dispatchEvent(new CustomEvent('todo:add', { bubbles: true, detail: { text, priority } }));
					input.value = '';
					input.focus();
				});
			}
		});

		wietDefine('todo-stats', class extends WietClass() {
			constructor() { super(); this.template = './widgets/todo/todo-stats.html'; }
			mounted() { document.addEventListener('todo:changed', () => this.update()); this.update(); }
			update() {
				const total = store.todos.length;
				const done = store.todos.filter(t => t.done).length;
				const pct = total === 0 ? 0 : Math.round((done / total) * 100);
				this.querySelector('.stats-label').textContent = `${done} of ${total} done`;
				this.querySelector('.stats-pct').textContent = `${pct}%`;
				this.querySelector('.stats-bar').style.width = `${pct}%`;
			}
		});

		wietDefine('todo-filter', class extends WietClass() {
			constructor() { super(); this.template = './widgets/todo/todo-filter.html'; }
			mounted() {
				this.querySelector('.bar').addEventListener('click', (e) => {
					const btn = e.target.closest('[data-filter]');
					if (!btn) return;
					this.dispatchEvent(new CustomEvent('todo:filter', { bubbles: true, detail: { filter: btn.dataset.filter } }));
				});
				document.addEventListener('todo:changed', () => this.updateActive());
			}
			updateActive() {
				this.querySelectorAll('[data-filter]').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === store.filter));
			}
		});

		wietDefine('todo-item', class extends WietClass() {
			static attrs = ['todo-id'];
			constructor() { super(); this.template = './widgets/todo/todo-item.html'; }
			mounted() {
				this.render();
				this.querySelector('.todo-check').addEventListener('change', () => {
					this.dispatchEvent(new CustomEvent('todo:toggle', { bubbles: true, detail: { id: Number(this.todoId) } }));
				});
				this.querySelector('.delete-btn').addEventListener('click', () => {
					this.dispatchEvent(new CustomEvent('todo:delete', { bubbles: true, detail: { id: Number(this.todoId) } }));
				});
			}
			changed() { this.render(); }
			render() {
				const todo = store.todos.find(t => t.id === Number(this.todoId));
				if (!todo) return;
				this.querySelector('.todo-item').classList.toggle('done', todo.done);
				this.querySelector('.todo-check').checked = todo.done;
				this.querySelector('.todo-text').textContent = todo.text;
				const dot = this.querySelector('.priority-dot');
				dot.className = `priority-dot ${todo.priority}`;
			}
		});

		wietDefine('todo-list', class extends WietClass() {
			constructor() { super(); this.template = './widgets/todo/todo-list.html'; }
			mounted() {
				document.addEventListener('todo:changed', () => this.renderItems());
				this.querySelector('.clear-done-btn').addEventListener('click', () => {
					store.todos = store.todos.filter(t => !t.done);
					notify();
				});
				this.renderItems();
			}
			renderItems() {
				const container = this.querySelector('.todo-items');
				const visible = filteredTodos();
				container.innerHTML = '';
				if (visible.length === 0) {
					const empty = document.createElement('div');
					empty.className = 'empty';
					empty.textContent = store.filter === 'done' ? 'No completed tasks yet.' : 'Nothing to do, enjoy your day!';
					container.appendChild(empty);
				} else {
					visible.forEach(todo => container.appendChild(wietCreate('todo-item', { attrs: { 'todo-id': String(todo.id) } })));
				}
				this.querySelector('.list-count').textContent = `${visible.length} item${visible.length !== 1 ? 's' : ''}`;
			}
		});

		wietDefine('todo-app', class extends WietClass() {
			constructor() { super(); this.template = './widgets/todo/todo-app-light.html'; }
			mounted() {
				this.addEventListener('todo:add', (e) => {
					store.todos.push({ id: store.nextId++, text: e.detail.text, priority: e.detail.priority, done: false });
					notify();
				});
				this.addEventListener('todo:toggle', (e) => {
					const todo = store.todos.find(t => t.id === e.detail.id);
					if (todo) todo.done = !todo.done;
					notify();
				});
				this.addEventListener('todo:delete', (e) => {
					store.todos = store.todos.filter(t => t.id !== e.detail.id);
					notify();
				});
				this.addEventListener('todo:filter', (e) => {
					store.filter = e.detail.filter;
					notify();
				});
			}
		});
	</script>
</body>

</html>
