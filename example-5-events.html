<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 5 - Events | Wiet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <page-header></page-header>

  <div class="container my-5">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <example-section icon="bi bi-5-circle-fill" title="Example 5: Events & Custom Events" description="Demonstrates standard DOM events (click) and custom events with event bubbling and detail payloads." variant="danger"></example-section>

        <div class="card mb-4">
          <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-eye"></i> Live Demo</h5>
          </div>
          <div class="card-body source">
            <counter-widget start="0"></counter-widget>

            <div class="mt-4">
              <div class="alert alert-info">
                <h6 class="alert-heading"><i class="bi bi-info-circle"></i> How It Works</h6>
                <ul class="mb-0 small">
                  <li><strong>Standard Events:</strong> Click handlers bound to buttons</li>
                  <li><strong>Custom Events:</strong> Component dispatches 'count-changed' event</li>
                  <li><strong>Event Bubbling:</strong> Events bubble up and can be caught at document level</li>
                  <li><strong>Event Detail:</strong> Custom data passed via event.detail</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <event-log id="eventLog"></event-log>

        <view-code></view-code>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" class="source">
    import { wiet } from './wiet.js';
    import './widgets.js';
    const eventLog = document.getElementById('eventLog');

    function logEvent(message, type = 'info') {
      eventLog.log(message, type);
    }

    wiet('counter-widget', './widgets/counter-widget.html', {
      attrs: ['start'],

      mounted() {
        logEvent('✅ counter-widget mounted', 'success');
        this.count = parseInt(this.start) || 0;
        this.updateDisplay();
      },

      handles: {
        '.btn-inc': {
          click() {
            this.count++;
            this.updateDisplay();
            logEvent(`➕ Increment button clicked (count: ${this.count})`, 'success');
            this.dispatchEvent(new CustomEvent('count-changed', {
              bubbles: true,
              detail: { count: this.count, action: 'increment' }
            }));
          }
        },
        '.btn-dec': {
          click() {
            this.count--;
            this.updateDisplay();
            logEvent(`➖ Decrement button clicked (count: ${this.count})`, 'danger');
            this.dispatchEvent(new CustomEvent('count-changed', {
              bubbles: true,
              detail: { count: this.count, action: 'decrement' }
            }));
          }
        },
        '.btn-reset': {
          click() {
            this.count = 0;
            this.updateDisplay();
            logEvent(`🔄 Reset button clicked (count: ${this.count})`, 'warning');
            this.dispatchEvent(new CustomEvent('count-changed', {
              bubbles: true,
              detail: { count: this.count, action: 'reset' }
            }));
          }
        }
      },

      methods: {
        updateDisplay() {
          this.querySelector('.counter-display').textContent = this.count;
        }
      }
    });

    // Listen for custom events at document level
    document.addEventListener('count-changed', (e) => {
      logEvent(`📢 Custom event 'count-changed' caught! Action: ${e.detail.action}, Count: ${e.detail.count}`, 'info');
    });

    setTimeout(() => logEvent('🚀 Component with events initialized', 'success'), 100);
  </script>
</body>

</html>
