<div class="card mb-3">
  <div class="card-body text-center">
    <h4 class="card-title">Counter Widget</h4>
    <div class="display-1 counter-display">0</div>
    <div class="d-flex justify-content-center gap-2 mt-3">
      <button class="btn btn-danger btn-dec"><i class="bi bi-dash me-1"></i>Decrease</button>
      <button class="btn btn-secondary btn-reset"><i class="bi bi-arrow-clockwise me-1"></i>Reset</button>
      <button class="btn btn-success btn-inc"><i class="bi bi-plus me-1"></i>Increase</button>
    </div>
  </div>
</div>
