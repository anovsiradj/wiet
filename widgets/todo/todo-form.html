<style>
	:host { display: block; }
	.form { display: flex; gap: 8px; margin-bottom: 16px; }
	.input { flex: 1; padding: 6px 12px; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #eee; font-size: 14px; }
	.input:focus { outline: none; border-color: #0dcaf0; }
	.select { padding: 6px 12px; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #eee; font-size: 14px; }
	.btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; background: #0dcaf0; color: #000; font-size: 14px; }
	.btn:hover { background: #31d2f2; }
</style>
<form class="form">
	<input type="text" class="input" placeholder="What needs to be done?" required>
	<select class="select">
		<option value="low"> Low</option>
		<option value="medium" selected> Medium</option>
		<option value="high"> High</option>
	</select>
	<button type="submit" class="btn">+</button>
</form>
