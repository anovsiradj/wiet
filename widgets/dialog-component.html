<style>
  .dialog {
    border: 2px solid #9b59b6;
    border-radius: 8px;
    background: white;
    color: #333;
    margin: 10px 0;
    overflow: hidden;
  }

  .dialog-header {
    background: #9b59b6;
    color: white;
    padding: 15px;
    font-weight: bold;
    font-size: 1.2em;
  }

  .dialog-body {
    padding: 20px;
  }

  .dialog-footer {
    background: #ecf0f1;
    padding: 15px;
    text-align: right;
  }
</style>
<div class="dialog">
  <div class="dialog-header">
    <slot name="title">Dialog Title</slot>
  </div>
  <div class="dialog-body">
    <slot name="content">Dialog content goes here.</slot>
  </div>
  <div class="dialog-footer">
    <slot name="footer">
      <button class="btn btn-sm btn-primary">OK</button>
    </slot>
  </div>
</div>
